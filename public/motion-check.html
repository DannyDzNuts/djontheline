<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>DJ — temporary motion check</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#181d19;color:#f0eee6;font:14px/1.5 system-ui}header{padding:16px}h1{font-size:18px;margin:0 0 8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}button{font:inherit;padding:10px;margin-right:8px}iframe{display:block;width:100%;height:65vh;border:0}small{display:block;margin-top:8px;color:#abb3aa}
</style>
</head>
<body>
<header><h1>Temporary portfolio motion check</h1><pre id="status">JavaScript has not executed.</pre><button id="replay" type="button">Reload portfolio</button><button id="dish" type="button">Show burger</button><small>This check only displays browser status locally. It sends no diagnostic information anywhere.</small></header>
<iframe id="portfolio" src="/" title="Portfolio under test"></iframe>
<script>
(function(){
 var panel=document.getElementById('status'),frame=document.getElementById('portfolio');
 var media=window.matchMedia('(prefers-reduced-motion: reduce)'),lastError='none',maxScale=1,minOpacity=1;
 window.addEventListener('error',function(event){lastError=event.message;});
 function update(){
  var lines=['JavaScript: running','Reduced motion: '+media.matches,'Page visible: '+(!document.hidden),'Browser: '+navigator.userAgent];
  try{
   var w=frame.contentWindow,d=frame.contentDocument,hero=d.querySelector('.hero-media'),dish=d.querySelector('#bacon-jalapeno-burger'),photo=dish&&dish.querySelector('.media-frame');
   lines.push('Portfolio controller: '+(d.documentElement.dataset.motion||'not initialized'));
   if(hero){var style=w.getComputedStyle(hero);var match=style.transform.match(/^matrix\(([^,]+)/);if(match)maxScale=Math.max(maxScale,Number(match[1]));lines.push('Hero ready: '+hero.closest('.signature-hero').classList.contains('hero-media-ready'),'Largest hero scale seen: '+maxScale.toFixed(3));}
   if(photo){var ps=w.getComputedStyle(photo);minOpacity=Math.min(minOpacity,Number(ps.opacity));lines.push('Burger revealed: '+dish.classList.contains('is-visible'),'Burger opacity: '+ps.opacity,'Lowest burger opacity seen: '+minOpacity.toFixed(2),'Burger transform: '+ps.transform);}
  }catch(error){lastError=error.message;}
  lines.push('Error: '+lastError);panel.textContent=lines.join('\n');
 }
 frame.addEventListener('load',function(){try{frame.contentWindow.addEventListener('error',function(event){lastError=event.message;});}catch(error){lastError=error.message;}});
 document.getElementById('replay').addEventListener('click',function(){maxScale=1;minOpacity=1;lastError='none';frame.contentWindow.location.reload();});
 document.getElementById('dish').addEventListener('click',function(){var el=frame.contentDocument.querySelector('#bacon-jalapeno-burger');if(el)el.scrollIntoView({block:'start'});});
 update();setInterval(update,100);
})();
</script>
</body></html>
